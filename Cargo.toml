[workspace]
members = ["crates/shodo", "dev/fixtures", "dev/bench"]
default-members = ["crates/shodo"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fulgur-rs/shodo"
homepage = "https://fulgur.dev/"

# Shared by two or more workspace members; keep a single resolved version to
# avoid the drift this section replaces (e.g. skrifa "0.44" vs "=0.44.0").
[workspace.dependencies]
fontique = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
harfrust = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
