[package]
name = "shodo"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "Text typesetting library for raikiri (work in progress)"
repository = "https://github.com/fulgur-rs/shodo"
homepage = "https://fulgur.dev/"
readme = "README.md"
keywords = ["typesetting", "text", "layout", "shaping"]
categories = ["text-processing", "graphics"]

[features]
accesskit = ["dep:accesskit"]
default = ["system-fonts", "web-fonts", "complex-scripts"]
complex-scripts = ["icu_segmenter/auto"]
web-fonts = ["dep:wuff", "dep:flate2", "dep:brotli-decompressor"]
system-fonts = ["fontique/system"]

[dependencies]
accesskit = { version = "=0.24.1", default-features = false, optional = true }
wuff = { version = "=0.2.9", default-features = false, optional = true }
flate2 = { version = "1.1", optional = true }
brotli-decompressor = { version = "5.0", optional = true }
fontique = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
harfrust = "0.12"
icu_properties = "2.3"
icu_casemap = "2.3"
icu_locale_core = "2.3"
icu_normalizer = "2.3"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
peniko = "0.6"
unicode-bidi = "0.3.18"

[dev-dependencies]
brotli = "8"

[workspace]
members = ["dev/fixtures", "dev/bench"]
default-members = ["."]
resolver = "3"
