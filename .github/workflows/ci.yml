name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Rendering fixtures are CPU-heavy; retain debug assertions and overflow checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled, but main runs always finish so
  # every job saves the dependency cache that pull requests restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Swatinem/rust-cache caches dependencies only; workspace crates rebuild in
# every job and for every distinct feature set. Jobs therefore run in parallel,
# and each job keeps its Cargo invocations on as few feature sets as possible.
# Caches are saved from main only: pull request caches are branch-scoped and
# would push the repository past the Actions cache quota.
#
# The accesskit feature is purely additive (no cfg(not(feature = "accesskit"))),
# so workspace tests run once with it enabled. The non-accesskit build stays
# covered by clippy and the -p shodo feature-isolation tests.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Check for machine-local home paths
        run: |
          if git grep -nIE '/(home|Users)/[A-Za-z0-9_.-]+/'; then
            echo "::error::tracked files contain absolute home-directory paths (see above); use repository-relative paths or ~/"
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --features shodo-harness/accesskit
      - name: Check published package contents
        run: |
          cargo package --list --offline -p shodo > /tmp/shodo-pkg-list.txt
          if grep -vE '^(src/|tests/|examples/)|^(Cargo\.(toml|toml\.orig|lock)|\.cargo_vcs_info\.json|CHANGELOG\.md|LICENSE-(APACHE|MIT)|README\.md)$' /tmp/shodo-pkg-list.txt; then
            echo "::error::cargo package -p shodo would publish unexpected paths (see above); update Cargo.toml [package].include"
            exit 1
          fi
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --features shodo-harness/accesskit
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clear restored snapshot reports
        run: rm -rf target/snapshot-report target/snapshot-checks
      - run: cargo test --workspace --features shodo-harness/accesskit
      - run: cargo run -p shodo-harness --features accesskit,shodo/complex-scripts --example accessibility
      - run: cargo run -p shodo-harness --example emoji_png -- target/emoji.png
      - run: cargo run -p shodo-harness --example ruby_png -- target/ruby-png
      - name: Check fixed glyph snapshots
        if: always()
        run: cargo run -p shodo-harness --example snapshots -- --output target/snapshot-report
      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.job }}
          path: |
            target/snapshot-report
            target/snapshot-checks
          if-no-files-found: warn

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p shodo --no-default-features
      - run: cargo test -p shodo --no-default-features --features complex-scripts
      - name: Check line cache with debug assertions disabled
        run: cargo test --release -p shodo --lib line::cache::tests
      - run: cargo test -p shodo-bench --example match_eviction_algorithms
      - run: cargo run -p shodo-bench --example match_cache_eviction -- warm 256 256 4 1024 1 2 16
      - run: cargo test -p shodo-bench --features allocation-counting --test allocator --test probe --test ruby_hit_path_allocations --test ruby_base_caret_range --test ruby_base_decoration --test style_memory --test suppressed_warning_format --test selection_allocations --test paint_geometry_allocations --test font_query_allocations --test font_descriptor_allocations --test ruby_constructor_allocations --test ruby_warning_import_allocations --test block_shift_allocations --test emphasis_extents_allocations
      - run: cargo test -p shodo-bench --bench layout
        env:
          SHODO_BENCH_CASE: latin-short

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Install verified release tool for changelog check
        run: bash tools/release/install-release-plz.sh
      - name: Check default release changelog generation
        run: python tools/release/check_release_plz.py "$(command -v release-plz)"
      - run: python -m unittest discover -s tools -v
      - run: python tools/fixtures/regenerate.py --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clear restored snapshot reports
        run: rm -rf target/snapshot-report target/snapshot-checks
      - run: cargo test --workspace --features shodo-harness/accesskit
      - run: cargo run -p shodo-harness --features accesskit,shodo/complex-scripts --example accessibility
      - run: cargo run -p shodo-harness --example emoji_png -- target/emoji.png
      - run: cargo run -p shodo-harness --example ruby_png -- target/ruby-png
      - name: Check fixed glyph snapshots
        if: always()
        run: cargo run -p shodo-harness --example snapshots -- --output target/snapshot-report
      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.job }}
          path: |
            target/snapshot-report
            target/snapshot-checks
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p shodo --target wasm32-unknown-unknown
      - run: cargo build -p shodo --target wasm32-unknown-unknown --no-default-features
      - run: cargo build -p shodo --target wasm32-unknown-unknown --no-default-features --features accesskit

  coverage:
    runs-on: ubuntu-latest
    # ci.yml has no workflow-level permissions; Codecov OIDC needs id-token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # cargo-llvm-cov
      # The workspace tests drive shodo through the dev harness and fixtures;
      # codecov.yml keeps dev/ out of the reported numbers.
      - name: Run tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --features shodo-harness/accesskit --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      # Fork pull requests get no OIDC token, so a failed upload must not fail CI.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
