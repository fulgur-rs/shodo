name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Rendering fixtures are CPU-heavy; retain debug assertions and overflow checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clear restored snapshot reports
        run: rm -rf target/snapshot-report target/snapshot-checks
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --features shodo-fixtures/accesskit
      - run: cargo test --workspace
      - run: cargo test --workspace --features shodo-fixtures/accesskit
      - run: cargo run -p shodo-fixtures --features accesskit,shodo/complex-scripts --example accessibility
      - run: cargo run -p shodo-fixtures --example emoji_png -- target/emoji.png
      - run: cargo run -p shodo-fixtures --example ruby_png -- target/ruby-png
      - name: Check fixed glyph snapshots
        if: always()
        run: cargo run -p shodo-fixtures --example snapshots -- --output target/snapshot-report
      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.job }}
          path: |
            target/snapshot-report
            target/snapshot-checks
          if-no-files-found: warn
      - run: cargo test -p shodo-bench --features allocation-counting --test allocator --test probe
      - run: cargo test -p shodo-bench --bench layout
        env:
          SHODO_BENCH_CASE: latin-short
      - run: cargo test -p shodo --no-default-features
      - run: cargo test -p shodo --no-default-features --features complex-scripts
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --features shodo-fixtures/accesskit
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dev/fixtures/tools/requirements.txt
      - run: python -m unittest discover -s dev/fixtures/tools -v
      - run: python -m unittest discover -s dev/bench/tools -v
      - run: python dev/fixtures/tools/regenerate.py --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Clear restored snapshot reports
        run: rm -rf target/snapshot-report target/snapshot-checks
      - run: cargo test --workspace
      - run: cargo test --workspace --features shodo-fixtures/accesskit
      - run: cargo run -p shodo-fixtures --features accesskit,shodo/complex-scripts --example accessibility
      - run: cargo run -p shodo-fixtures --example emoji_png -- target/emoji.png
      - run: cargo run -p shodo-fixtures --example ruby_png -- target/ruby-png
      - name: Check fixed glyph snapshots
        if: always()
        run: cargo run -p shodo-fixtures --example snapshots -- --output target/snapshot-report
      - name: Upload snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.job }}
          path: |
            target/snapshot-report
            target/snapshot-checks
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p shodo --target wasm32-unknown-unknown
      - run: cargo build -p shodo --target wasm32-unknown-unknown --no-default-features
      - run: cargo build -p shodo --target wasm32-unknown-unknown --no-default-features --features accesskit
