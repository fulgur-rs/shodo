name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-release-commit:
    name: Check whether this push is a release PR merge
    if: github.repository == 'fulgur-rs/shodo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      # release-plz itself only releases when HEAD is associated with a PR
      # whose branch starts with the release-pr branch prefix (default
      # `release-plz-`); everything else is a no-op inside the action. Skip
      # the job entirely for ordinary merges so the `release` environment's
      # required reviewer isn't asked to approve a deployment that release-plz
      # would just skip anyway.
      - name: Check associated PRs for a release-plz branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_release=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.head.ref | startswith("release-plz-"))] | length > 0')
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: check-release-commit
    if: needs.check-release-commit.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Publish crates and GitHub releases
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    name: Update release PR
    if: github.repository == 'fulgur-rs/shodo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
