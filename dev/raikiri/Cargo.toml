[package]
name = "shodo-raikiri"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "raikiri integration checks for shodo: contract verification, source coverage, style diffs (git-pinned raikiri dependency)"

# No [lib]; everything here is an example or integration test, so every
# dependency below is dev-only. `dev/raikiri/probe/` is not a Cargo target
# (see its own note) and is intentionally not reflected here.
[dev-dependencies]
shodo = { path = "../../crates/shodo", default-features = false }
shodo-fixtures = { path = "../fixtures" }
shodo-harness = { path = "../harness" }
fontique.workspace = true
skrifa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
raikiri-dom = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "a41dfcb4dc9ada1b39522238062d008d6169d10d" }
raikiri-html = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "a41dfcb4dc9ada1b39522238062d008d6169d10d" }
raikiri-style = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "a41dfcb4dc9ada1b39522238062d008d6169d10d" }
raikiri-traits = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "a41dfcb4dc9ada1b39522238062d008d6169d10d" }
tiny-skia = "=0.12.0"
url = "2"
percent-encoding = "2"

[[example]]
name = "ch_units"
test = true

[[example]]
name = "raikiri_contracts"
test = true

[[example]]
name = "raikiri_style_diffs"
test = true

[[example]]
name = "source_coverage"
test = true

[[example]]
name = "hanging_punctuation"
test = true

[[example]]
name = "vertical_wiring"
test = true

[[example]]
name = "style_handoff"
test = true
