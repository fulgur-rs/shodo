[package]
name = "shodo-raikiri"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "raikiri integration checks for shodo: contract verification, source coverage, style diffs (git-pinned raikiri dependency)"

# No [lib]; everything here is an example or integration test, so every
# dependency below is dev-only. `dev/raikiri/probe/` is not a Cargo target
# (see its own note) and is intentionally not reflected here.
[features]
allocation-counting = []

[dev-dependencies]
shodo = { path = "../../crates/shodo", default-features = false }
shodo-fixtures = { path = "../fixtures" }
shodo-harness = { path = "../harness" }
fontique.workspace = true
skrifa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
raikiri-dom = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "fe9aea9ade56ff046d38a6dddd31d02303466bfc" }
raikiri-html = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "fe9aea9ade56ff046d38a6dddd31d02303466bfc" }
raikiri-style = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "fe9aea9ade56ff046d38a6dddd31d02303466bfc" }
raikiri-traits = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "fe9aea9ade56ff046d38a6dddd31d02303466bfc" }
raikiri-paint = { git = "https://github.com/fulgur-rs/raikiri.git", rev = "fe9aea9ade56ff046d38a6dddd31d02303466bfc" }
anyrender = "=0.13.0"
anyrender_vello_cpu = "=0.16.0"
parley = "=0.11.1"
tiny-skia = "=0.12.0"
url = "2"
percent-encoding = "2"

[[example]]
name = "ch_units"
test = true

[[example]]
name = "raikiri_contracts"
test = true

[[example]]
name = "raikiri_style_diffs"
test = true

[[example]]
name = "source_coverage"
test = true

[[example]]
name = "hanging_punctuation"
test = true

[[example]]
name = "vertical_wiring"
test = true

[[example]]
name = "style_handoff"
test = true

[[example]]
name = "first_line_wpt"
test = true

[[example]]
name = "retained_caller"
test = true

[[example]]
name = "caller_windows"
test = false
