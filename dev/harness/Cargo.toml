[package]
name = "shodo-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Development harness: rendering, snapshots, browser comparison, float, and AccessKit checks for shodo"

[features]
accesskit = ["shodo/accesskit", "dep:accesskit_consumer"]

# skrifa and tiny-skia are used directly by src/glyph_paint.rs and
# src/bitmap_paint.rs (the shared painting library other crates depend on),
# so they are normal dependencies rather than dev-dependencies.
[dependencies]
accesskit_consumer = { version = "=0.38.0", optional = true }
shodo = { path = "../../crates/shodo", default-features = false }
shodo-fixtures = { path = "../fixtures" }
skrifa.workspace = true
tiny-skia = "=0.12.0"

[dev-dependencies]
fontique.workspace = true
harfrust.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
taffy = { version = "0.14", default-features = false, features = ["std", "float_layout"] }

[[example]]
name = "render_png"
test = true

[[example]]
name = "snapshots"
test = true

[[example]]
name = "paint_styles"
test = true

[[example]]
name = "accessibility"
required-features = ["accesskit"]
test = true

[[example]]
name = "emoji_png"
test = true

[[example]]
name = "ruby_png"
test = true
