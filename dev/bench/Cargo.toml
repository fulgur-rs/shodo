[package]
autobins = false
name = "shodo-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Reproducible standalone shodo development measurements"

[features]
default = ["complex-scripts"]
complex-scripts = ["shodo/complex-scripts"]
allocation-counting = []

[dependencies]
shodo = { path = "../..", default-features = false }
shodo-fixtures = { path = "../fixtures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "allocator"
required-features = ["allocation-counting"]

[[bin]]
name = "shodo-probe"
path = "src/bin/probe.rs"

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false
