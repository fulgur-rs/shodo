[package]
autobins = false
name = "shodo-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Reproducible standalone shodo development measurements"

[features]
default = ["complex-scripts"]
complex-scripts = ["shodo/complex-scripts"]
allocation-counting = []

[dependencies]
shodo = { path = "../../crates/shodo", default-features = false }
shodo-fixtures = { path = "../fixtures" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "allocator"
required-features = ["allocation-counting"]

[[bin]]
name = "shodo-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "shodo-font-match-probe"
path = "src/bin/font_match_probe.rs"

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false

[[example]]
name = "ruby_inputs"

[[example]]
name = "ruby_content_restore"

[[example]]
name = "style_metric_instances"

[[example]]
name = "whitespace_flags"

[[example]]
name = "combined_width_trial"

[[example]]
name = "ruby_hit_index"

[[example]]
name = "accesskit_word_starts"
required-features = ["shodo/accesskit"]

[[example]]
name = "suppressed_warning_format"

[[example]]
name = "offset_mapping_index"

[[example]]
name = "shape_window_prep"

[[example]]
name = "missing_font_scalars"

[[example]]
name = "combine_empty_passes"

[[example]]
name = "tcy_base_reuse"

[[example]]
name = "d77_scale"
