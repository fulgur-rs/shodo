[package]
name = "shodo-fixtures"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Fixed development inputs for shodo (font assets separately licensed under OFL-1.1)"

[dependencies]
shodo = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
skrifa = "0.44"
harfrust = "0.12"
