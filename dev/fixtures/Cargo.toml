[package]
name = "shodo-fixtures"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Fixed development inputs for shodo (font assets separately licensed under OFL-1.1)"

[dependencies]
shodo = { path = "../../crates/shodo", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

# fontique/skrifa/harfrust are used directly (not through shodo's public API) by
# tests/fixtures.rs and tests/emoji_fixtures.rs to validate the checked-in font
# assets themselves. Rendering, browser-comparison, and raikiri-integration
# dependencies moved out to shodo-harness / shodo-raikiri (see shodo-c6r.3).
[dev-dependencies]
fontique.workspace = true
skrifa.workspace = true
harfrust.workspace = true
